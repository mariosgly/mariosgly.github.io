<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <title>Audio Audit Favicon</title>
  <desc>A minimalist flat design of a magnifying glass over an audio waveform, representing an audit of an audio embedding.</desc>

  <!-- Minimalist Solid Background -->
  <rect width="256" height="256" rx="56" fill="#0F172A" />

  <!-- Magnifying Glass Handle -->
  <line 
    x1="157" y1="157" 
    x2="216" y2="216" 
    stroke="#FFFFFF" 
    stroke-width="32" 
    stroke-linecap="round" 
  />

  <!-- Magnifying Glass Ring -->
  <circle 
    cx="112" cy="112" 
    r="64" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="24" 
  />

  <!-- Reconstructed Audio Waveform (Flat Color) -->
  <rect x="72" y="88" width="16" height="48" rx="8" fill="#06B6D4" />
  <rect x="104" y="64" width="16" height="96" rx="8" fill="#06B6D4" />
  <rect x="136" y="80" width="16" height="64" rx="8" fill="#06B6D4" />
</svg>